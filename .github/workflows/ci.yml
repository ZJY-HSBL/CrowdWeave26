name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.10.0" "torchvision==0.25.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q crowdweave crowdweave26 scripts

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned YOLO26
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.10.0" "torchvision==0.25.0" --index-url https://download.pytorch.org/whl/cpu
          git clone --filter=blob:none https://github.com/ultralytics/ultralytics.git upstream
          git -C upstream checkout --detach a0fd1d727fe5ef5c0f6837646f794eba5b0575f5
          python -m pip install -e ./upstream
          python -m pip install -e ".[dev]"
      - name: Verify YOLO26 real graph forward and gradients
        run: python -m pytest -q tests/test_integration_api.py
      - name: Verify YOLO26 NMS and NMS-free inference API
        run: python -m pytest -q tests/test_evaluation_inference_api.py
      - name: Verify native Mosaic flip ignore geometry and masked gradients
        run: python -m pytest -q tests/test_ignore_integration.py
      - name: Verify real official GOTP O2M O2O criterion
        run: python -m pytest -q tests/test_integration_api.py -k gotp
      - name: Train baseline CRA with GOTP auxiliary enabled
        run: python scripts/smoke_train.py --mechanism none --assignment cra --gotp-weight 0.15
      - name: Train full ignore-aware Mosaic GOTP combination
        run: python scripts/smoke_train.py --mechanism both --assignment cra --ignore-aware --mosaic --gotp-weight 0.15
      - name: Train one epoch with ignore-aware Mosaic SCAD CFSR CRA
        run: python scripts/smoke_train.py --mechanism both --assignment cra --ignore-aware --mosaic
      - name: Train one synthetic epoch with CRA on CPU
        run: python scripts/smoke_train.py --mechanism none --assignment cra
      - name: Train one synthetic epoch with SCAD CFSR and CRA
        run: python scripts/smoke_train.py --mechanism both --assignment cra


  crowdhuman_reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference evaluator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy tqdm
      - name: Clone pinned CrowdDetection evaluation reference
        run: |
          git clone --filter=blob:none https://github.com/megvii-model/CrowdDetection.git official-crowd
          git -C official-crowd checkout --detach 9786f58869a55af3e0b51fc78f8638a825dae4a2
      - name: Verify ignore-aware AP MR JI reference pipeline
        env:
          CROWDWEAVE_REFERENCE_EVAL: official-crowd
        run: python -m pytest -q tests/test_official_evaluation.py
