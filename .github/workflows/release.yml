name: Publish Release
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish release and immutable source ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          asset="CrowdWeave26-${version}.zip"
          if gh release view "$version" >/dev/null 2>&1; then
            ref="$version"
          else
            ref="$GITHUB_SHA"
          fi
          git archive --format=zip --prefix="CrowdWeave26-${version}/" --output="$asset" "$ref"
          if gh release view "$version" >/dev/null 2>&1; then
            if gh release view "$version" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              echo "Release and ZIP already exist; refusing to overwrite versioned asset."
              exit 0
            fi
            gh release upload "$version" "$asset"
          else
            gh release create "$version" "$asset" --target "$GITHUB_SHA" --title "CrowdWeave26 $version" --notes-file CHANGELOG.md
          fi
