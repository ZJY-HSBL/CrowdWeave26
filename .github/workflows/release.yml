name: Publish Release
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.10.0" "torchvision==0.25.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Run tests before publication
        run: python -m pytest -q
      - name: Install pinned Ultralytics YOLO26 for release gate
        run: |
          git clone --filter=blob:none https://github.com/ultralytics/ultralytics.git upstream
          git -C upstream checkout --detach a0fd1d727fe5ef5c0f6837646f794eba5b0575f5
          python -m pip install -e ./upstream
      - name: Verify real YOLO26 graph before release
        run: python -m pytest -q tests/test_integration_api.py
      - name: Verify YOLO26 NMS and NMS-free inference API
        run: python -m pytest -q tests/test_evaluation_inference_api.py
      - name: Verify native ignore geometry and class masking
        run: python -m pytest -q tests/test_ignore_integration.py
      - name: Verify unique-GT GOTP training and validation criterion
        run: python -m pytest -q tests/test_integration_api.py -k gotp
      - name: Verify full GOTP and Mosaic ignore-aware train loop
        run: python scripts/smoke_train.py --mechanism both --assignment cra --ignore-aware --mosaic --gotp-weight 0.15
      - name: Verify ignore-aware augmented training
        run: python scripts/smoke_train.py --mechanism both --assignment cra --ignore-aware --mosaic
      - name: Verify one-epoch CRA training smoke
        run: python scripts/smoke_train.py --mechanism none --assignment cra
      - name: Verify combined SCAD CFSR CRA train loop
        run: python scripts/smoke_train.py --mechanism both --assignment cra
      - name: Install pinned CrowdDetection benchmark toolkit
        run: |
          python -m pip install numpy tqdm
          git clone --filter=blob:none https://github.com/megvii-model/CrowdDetection.git official-crowd
          git -C official-crowd checkout --detach 9786f58869a55af3e0b51fc78f8638a825dae4a2
      - name: Verify official CrowdHuman AP MR JI adapter
        env:
          CROWDWEAVE_REFERENCE_EVAL: official-crowd
        run: python -m pytest -q tests/test_official_evaluation.py
      - name: Build reproducible source ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          python scripts/package_release.py --tag "$version" --output dist
      - name: Create Release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; refusing to overwrite"
            exit 0
          fi
          gh release create "$version" "dist/CrowdWeave26-$version.zip" \
            --target "$GITHUB_SHA" --title "CrowdWeave26 $version" \
            --notes-file CHANGELOG.md
