[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdweave26"
version = "0.2.0"
description = "Reproducible dense pedestrian YOLO26 research toolkit"
requires-python = ">=3.10"
dependencies = ["Pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=8", "torch>=2.1"]

[project.scripts]
crowdweave = "crowdweave.cli:main"

[tool.setuptools.packages.find]
include = ["crowdweave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
